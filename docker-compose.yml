services:
  mongodb:
    image: mongo:7
    container_name: learning-platform-db
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: learning-platform-server
    ports:
      - '3000:3000'
    environment:
      MONGODB_URI: mongodb://mongodb:27017/learning-platform
      JWT_SECRET: ${JWT_SECRET:-docker-dev-jwt-secret-change-me}
      JWT_EXPIRATION: 7d
      PORT: 3000
      # Browser reaches API/media via published port 3000 (and via client nginx proxy)
      PUBLIC_APP_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080,http://localhost
      MAX_IMAGE_SIZE_BYTES: 5242880
      MAX_VIDEO_SIZE_BYTES: 209715200
      THROTTLE_TTL_MS: 60000
      THROTTLE_LIMIT: 120
      THROTTLE_AUTH_LIMIT: 5
      THROTTLE_UPLOAD_LIMIT: 30
    volumes:
      - upload-data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/docs').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  seed:
    build: ./server
    container_name: learning-platform-seed
    environment:
      MONGODB_URI: mongodb://mongodb:27017/learning-platform
      JWT_SECRET: ${JWT_SECRET:-docker-dev-jwt-secret-change-me}
    volumes:
      - upload-data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: 'no'
    command: ['node', 'dist/seed.js']
    profiles: ['seed']

  client:
    build: ./client
    container_name: learning-platform-client
    ports:
      - '8080:80'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  upload-data:
